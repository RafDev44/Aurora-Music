<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b16" />
    <title>Aurora Player</title>
  </head>
  <body>
    <div id="boot-splash" role="status" aria-label="Loading Aurora Player">
      <div class="boot-splash-aurora boot-splash-aurora-one"></div>
      <div class="boot-splash-aurora boot-splash-aurora-two"></div>
      <div class="boot-splash-aurora boot-splash-aurora-three"></div>
      <div class="boot-splash-orb"></div>
      <div class="boot-splash-content">
        <div class="boot-splash-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <defs>
              <linearGradient
                id="boot-aurora-logo-gradient"
                x1="7"
                y1="7"
                x2="41"
                y2="42"
                gradientUnits="userSpaceOnUse"
              >
                <stop stop-color="#c4b5fd" />
                <stop offset="1" stop-color="#7c3aed" />
              </linearGradient>
            </defs>
            <path
              d="M24 3.5c3.5 0 6.6 5.8 7.4 13.9C38.8 18.2 44.5 21 44.5 24s-5.7 5.8-13.1 6.6C30.6 38.7 27.5 44.5 24 44.5s-6.6-5.8-7.4-13.9C9.2 29.8 3.5 27 3.5 24s5.7-5.8 13.1-6.6C17.4 9.3 20.5 3.5 24 3.5Z"
              fill="url(#boot-aurora-logo-gradient)"
              opacity=".98"
            />
            <circle cx="24" cy="24" r="7.5" fill="#09090b" opacity=".9" />
            <circle cx="24" cy="24" r="3.5" fill="#f5f5f7" />
          </svg>
        </div>
        <div class="boot-splash-wordmark">
          <strong>Aurora</strong>
          <small>Music</small>
        </div>
        <span class="boot-splash-status">Preparing your library</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #07070b;
        color: #f5f5f7;
        opacity: 1;
        transition: opacity 0.42s ease;
      }
      #boot-splash.boot-splash-exit {
        pointer-events: none;
        opacity: 0;
      }
      .boot-splash-orb {
        position: absolute;
        top: 50%;
        left: 50%;
        width: min(78vw, 860px);
        aspect-ratio: 1;
        border-radius: 999px;
        background:
          radial-gradient(
            circle at 35% 35%,
            rgb(167 139 250 / 76%),
            transparent 53%
          ),
          radial-gradient(
            circle at 68% 66%,
            rgb(34 211 238 / 58%),
            transparent 58%
          ),
          radial-gradient(
            circle at 55% 45%,
            rgb(244 114 182 / 42%),
            transparent 64%
          );
        filter: blur(54px) saturate(175%);
        transform: translate(-50%, -50%);
        animation: boot-splash-drift 7s ease-in-out infinite alternate;
      }
      .boot-splash-aurora {
        position: absolute;
        width: min(92vw, 1100px);
        height: min(64vh, 560px);
        border-radius: 50%;
        filter: blur(54px) saturate(185%);
        opacity: 0.72;
        mix-blend-mode: screen;
        will-change: transform;
      }
      .boot-splash-aurora-one {
        background: radial-gradient(
          ellipse at 25% 50%,
          rgb(124 58 237 / 68%),
          transparent 68%
        );
        transform: translate(-22%, -10%) rotate(-18deg);
        animation: boot-splash-ribbon-one 8s ease-in-out infinite alternate;
      }
      .boot-splash-aurora-two {
        background: radial-gradient(
          ellipse at 72% 42%,
          rgb(6 182 212 / 60%),
          transparent 66%
        );
        transform: translate(22%, 12%) rotate(16deg);
        animation: boot-splash-ribbon-two 10s ease-in-out infinite alternate;
      }
      .boot-splash-aurora-three {
        background: radial-gradient(
          ellipse at 52% 52%,
          rgb(236 72 153 / 42%),
          transparent 62%
        );
        transform: translate(0, 0) rotate(-5deg) scale(0.8);
        animation: boot-splash-ribbon-three 12s ease-in-out infinite alternate;
      }
      .boot-splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 1;
        font:
          600 12px/1 Inter,
          'Segoe UI',
          sans-serif;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .boot-splash-mark {
        display: grid;
        width: 96px;
        height: 96px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 24%);
        border-radius: 32px;
        background: rgb(255 255 255 / 8%);
        box-shadow:
          0 24px 72px rgb(124 58 237 / 52%),
          inset 0 1px 0 rgb(255 255 255 / 18%);
        backdrop-filter: blur(18px);
      }
      .boot-splash-mark svg {
        width: 66px;
        height: 66px;
        filter: drop-shadow(0 10px 24px rgb(167 139 250 / 62%));
      }
      .boot-splash-wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: #f5f5f7;
        letter-spacing: 0;
        text-transform: none;
      }
      .boot-splash-wordmark strong {
        font-size: 21px;
        font-weight: 650;
      }
      .boot-splash-wordmark small {
        color: rgb(245 245 247 / 54%);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .boot-splash-status {
        margin-top: 12px;
        color: rgb(245 245 247 / 46%);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      @keyframes boot-splash-drift {
        from {
          transform: translate3d(-54%, -53%, 0) scale(0.94);
        }
        to {
          transform: translate3d(-46%, -47%, 0) scale(1.06);
        }
      }
      @keyframes boot-splash-ribbon-one {
        from {
          transform: translate(-24%, -10%) rotate(-18deg) scale(0.92);
        }
        to {
          transform: translate(-12%, 8%) rotate(-10deg) scale(1.08);
        }
      }
      @keyframes boot-splash-ribbon-two {
        from {
          transform: translate(20%, 14%) rotate(14deg) scale(0.94);
        }
        to {
          transform: translate(8%, -8%) rotate(22deg) scale(1.08);
        }
      }
      @keyframes boot-splash-ribbon-three {
        from {
          transform: translate(-2%, 4%) rotate(-8deg) scale(0.78);
        }
        to {
          transform: translate(4%, -4%) rotate(8deg) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-orb,
        .boot-splash-aurora {
          animation: none;
        }
      }
    </style>
  </body>
</html>
